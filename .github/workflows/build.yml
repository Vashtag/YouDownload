name: Build app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: YouDownload-Windows.exe
          - os: macos-latest
            asset: YouDownload-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build.py

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\YouDownload.exe -ArgumentList "--selftest","selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }
          Move-Item dist\YouDownload.exe "${{ matrix.asset }}"

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/YouDownload.app/Contents/MacOS/YouDownload --selftest selftest.json || { cat selftest.json; exit 1; }
          cat selftest.json
          ditto -c -k --keepParent dist/YouDownload.app "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Publishes a release when a v* tag is pushed, or when a commit message
  # contains "[release]" (the version then comes from the VERSION file).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: YouDownload ${{ steps.version.outputs.tag }}
          make_latest: true
          files: assets/*
          generate_release_notes: true
