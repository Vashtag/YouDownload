<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouDownload</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>You<span>Download</span></h1>
      <p class="sub">Paste a YouTube link, pick a quality, and download the video or an MP3.</p>
    </header>

    <form id="url-form" class="card">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
      <button id="fetch-btn" type="submit">Get options</button>
    </form>

    <p id="error" class="error" hidden></p>

    <section id="result" class="card" hidden>
      <div class="video">
        <img id="thumb" alt="">
        <div>
          <h2 id="title"></h2>
          <p id="meta" class="muted"></p>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-kind="video" role="tab">Video (MP4)</button>
        <button type="button" class="tab" data-kind="audio" role="tab">Audio (MP3)</button>
      </div>

      <div class="panel" data-panel="video">
        <label for="quality">Quality</label>
        <select id="quality"></select>
      </div>

      <div class="panel" data-panel="audio" hidden>
        <label for="bitrate">Bitrate</label>
        <select id="bitrate">
          {% for b in bitrates %}
          <option value="{{ b }}" {% if b == "192" %}selected{% endif %}>{{ b }} kbps</option>
          {% endfor %}
        </select>
      </div>

      <button id="download-btn" type="button" class="primary">Download</button>

      <div id="progress" hidden>
        <div class="bar"><div id="bar-fill"></div></div>
        <p id="status" class="muted"></p>
      </div>
    </section>

    <footer class="muted">Only download content you own or have permission to download.</footer>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
